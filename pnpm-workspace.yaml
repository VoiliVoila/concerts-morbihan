# Supply-chain policy: do not lower these values in a project or command.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
allowBuilds:
  esbuild: true

# Keep PostCSS on the patched nanoid release until its transitive resolution is refreshed upstream.
overrides:
  "postcss@8.5.25>nanoid": 3.3.18

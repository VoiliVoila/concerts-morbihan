name: Daily concert refresh

# Reruns the concert fetch every day, updates src/data/events.json and
# pushes it. The push triggers a Cloudflare Pages rebuild (Git integration),
# which regenerates the site with fresh dates. No secrets required.

on:
  schedule:
    - cron: '0 5 * * *' # 05:00 UTC ≈ 07:00 Paris time in summer
  workflow_dispatch: {} # also allows a manual trigger from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit/push events.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.20.0
          corepack pnpm --version

      - run: corepack pnpm install --frozen-lockfile

      - name: Fetch concerts
        run: corepack pnpm run fetch

      - name: Commit if data changed
        run: |
          git config user.name "concerts-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- src/data/events.json; then
            echo "No change in events.json — nothing to do."
          else
            git add src/data/events.json
            git commit -m "chore: daily concert refresh [skip ci]"
            git push
          fi
